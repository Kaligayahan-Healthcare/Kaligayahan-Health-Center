# Publishes the public website (the website/ folder) on GitHub Pages, at
# https://<account>.github.io/<repository>/ , by updating the "gh-pages" branch.
# The staff portal, the server code and the guides are NOT published.
# No repository setting is needed: GitHub serves the gh-pages branch automatically.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the public site (no staff portal, no server code)
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir _site
          cp -r website/. _site/
          rm -f _site/staff.html
          # the "page not found" page is shown at any address, so its links need the full path
          sed -i "s|href=\"/favicon.png\"|href=\"/$REPO/favicon.png\"|; s|href=\"/fonts/fonts.css\"|href=\"/$REPO/fonts/fonts.css\"|; s|href=\"/styles.css\"|href=\"/$REPO/styles.css\"|; s|href=\"/\"|href=\"/$REPO/\"|" _site/404.html
          # a new name for the script and styles on every publish, so browsers never keep an old copy
          V="${GITHUB_SHA::7}"
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$V\"|; s|href=\"styles.css\"|href=\"styles.css?v=$V\"|; s|href=\"fonts/fonts.css\"|href=\"fonts/fonts.css?v=$V\"|" _site/index.html
          grep -q "app.js?v=$V" _site/index.html
          touch _site/.nojekyll

      - name: Update the gh-pages branch
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
